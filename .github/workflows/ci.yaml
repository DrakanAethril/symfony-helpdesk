---
name: CI

on:
  push:
    branches:
      - main
  pull_request: ~
  workflow_dispatch: ~

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build Docker images
        uses: docker/bake-action@v7
        with:
          pull: true
          load: true
          source: .
          files: |
            compose.yaml
            compose.override.yaml
          set: |
            *.cache-from=type=gha,scope=${{github.ref}}
            *.cache-from=type=gha,scope=refs/heads/main
            *.cache-to=type=gha,scope=${{github.ref}},mode=max
      - name: Start services
        run: |
          docker compose up --wait --no-build database
          docker compose up --wait --no-build
      - name: Build Tailwind CSS
        run: docker compose exec -T php bin/console tailwind:build
      - name: Check HTTP reachability
        run: curl -v --fail-with-body http://localhost
      - name: Check HTTPS reachability
        run: curl -v --insecure --fail-with-body https://localhost
      - name: Check Mercure reachability
        run: curl -vI --insecure --fail-with-body https://localhost/.well-known/mercure?topic=test
      - name: Allow the app user to create the test database
        run: |
          root_password=$(docker compose logs database | grep -o 'GENERATED ROOT PASSWORD: [^ ]*' | cut -d' ' -f4)
          docker compose exec -T database mysql -uroot -p"$root_password" -e "GRANT ALL PRIVILEGES ON \`app_test%\`.* TO 'app'@'%'"
      - name: Create test database
        run: docker compose exec -T php bin/console -e test doctrine:database:create
      - name: Run migrations
        run: docker compose exec -T php bin/console -e test doctrine:migrations:migrate --no-interaction
      - name: Run PHPUnit
        run: docker compose exec -T php bin/phpunit
      - name: Doctrine Schema Validator
        run: docker compose exec -T php bin/console -e test doctrine:schema:validate
      - name: Show service logs on failure
        if: failure()
        run: |
          docker compose ps --all
          docker compose logs --no-color
          msg=$(docker compose logs --no-color 2>&1 | grep -v ' Installing ' | sed -e 's/\x1b\[[0-9;]*m//g' | tail -n 30 | cut -c 1-200 | sed -e 's/%/%25/g' -e 's/\r//g' | awk '{printf "%s%%0A", $0}')
          echo "::error title=Service logs::${msg}"
